name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VER="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST_VER" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($MANIFEST_VER)"
            exit 1
          fi
          node --check main.js

      - name: Create GitHub release with plugin assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
